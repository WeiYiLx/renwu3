<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>霍夫圆检测</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --ink: #1f2328;
    --muted: #6b7280;
    --border: #d8dde3;
    --accent: #1d6fd8;
    --danger: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans SC", sans-serif;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; }
  header .spacer { flex: 1; }
  button, input[type=file] {
    font: inherit;
    padding: 7px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel);
    color: var(--ink);
    cursor: pointer;
  }
  input[type=file] { padding: 5px 8px; }
  button:disabled { color: var(--muted); cursor: not-allowed; }
  button:not(:disabled):hover, input[type=file]:hover { border-color: var(--accent); }
  main {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    padding: 16px 20px 24px;
  }
  aside {
    width: 320px;
    flex: none;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px 18px;
  }
  aside h2 { margin: 0 0 12px; font-size: 14px; font-weight: 600; }
  .param { margin-bottom: 12px; }
  .param .row { display: flex; justify-content: space-between; gap: 8px; }
  .param label { color: var(--muted); }
  .param output { font-variant-numeric: tabular-nums; font-weight: 600; }
  .param input[type=range] { width: 100%; margin: 4px 0 0; accent-color: var(--accent); }
  #reset { width: 100%; margin-top: 4px; }
  section {
    flex: 1;
    min-width: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px 18px;
  }
  .status { margin: 0 0 12px; color: var(--muted); min-height: 21px; }
  .status.error { color: var(--danger); }
  .stage {
    min-height: 320px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #eef1f4;
    border: 1px dashed var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .stage img { display: block; max-width: 100%; max-height: 68vh; }
  table {
    width: 100%;
    margin-top: 14px;
    border-collapse: collapse;
    font-variant-numeric: tabular-nums;
  }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
</style>
</head>
<body>
<header>
  <h1>霍夫圆检测</h1>
  <input id="file" type="file" accept="image/jpeg,image/png">
  <button id="export" disabled>导出标注图</button>
  <span class="spacer"></span>
  <span id="image-info" class="status"></span>
</header>

<main>
  <aside>
    <h2>检测参数</h2>

    <div class="param">
      <div class="row"><label for="dp">dp 分辨率比</label><output for="dp"></output></div>
      <input id="dp" type="range" min="1" max="2" step="0.1" value="1.2" data-key="dp">
    </div>

    <div class="param">
      <div class="row"><label for="minDist">minDist 最小圆心距</label><output for="minDist"></output></div>
      <input id="minDist" type="range" min="10" max="500" step="5" value="100" data-key="minDist">
    </div>

    <div class="param">
      <div class="row"><label for="param1">param1 Canny 高阈值</label><output for="param1"></output></div>
      <input id="param1" type="range" min="30" max="300" step="5" value="100" data-key="param1">
    </div>

    <div class="param">
      <div class="row"><label for="param2">param2 累加器阈值</label><output for="param2"></output></div>
      <input id="param2" type="range" min="10" max="150" step="1" value="45" data-key="param2">
    </div>

    <div class="param">
      <div class="row"><label for="minRadius">minRadius 最小半径</label><output for="minRadius"></output></div>
      <input id="minRadius" type="range" min="0" max="600" step="5" value="20" data-key="minRadius">
    </div>

    <div class="param">
      <div class="row"><label for="maxRadius">maxRadius 最大半径（0 为自动）</label><output for="maxRadius"></output></div>
      <input id="maxRadius" type="range" min="0" max="1200" step="5" value="0" data-key="maxRadius">
    </div>

    <div class="param">
      <div class="row"><label for="blur">blur 中值滤波核</label><output for="blur"></output></div>
      <input id="blur" type="range" min="1" max="15" step="2" value="5" data-key="blur">
    </div>

    <button id="reset">恢复默认参数</button>
  </aside>

  <section>
    <p id="status" class="status">请先导入一张 JPEG 或 PNG 图片。</p>
    <div class="stage"><img id="preview" alt="标注预览" hidden></div>
    <table id="circles" hidden>
      <thead><tr><th>#</th><th>圆心 x</th><th>圆心 y</th><th>半径 r</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
</main>

<script>
const DEFAULTS = { dp: 1.2, minDist: 100, param1: 100, param2: 45, minRadius: 20, maxRadius: 0, blur: 5 };

const fileInput = document.getElementById("file");
const exportButton = document.getElementById("export");
const resetButton = document.getElementById("reset");
const preview = document.getElementById("preview");
const statusLine = document.getElementById("status");
const imageInfo = document.getElementById("image-info");
const circleTable = document.getElementById("circles");
const circleBody = circleTable.querySelector("tbody");
const sliders = Array.from(document.querySelectorAll("input[type=range]"));

const state = { imageId: null, imageName: null, circles: [], seq: 0, timer: null };

function setStatus(message, isError = false) {
  statusLine.textContent = message;
  statusLine.classList.toggle("error", isError);
}

function formatValue(input) {
  return input.dataset.key === "dp" ? Number(input.value).toFixed(1) : input.value;
}

function syncLabels() {
  for (const input of sliders) {
    input.parentElement.querySelector("output").textContent = formatValue(input);
  }
}

function readParams() {
  const params = {};
  for (const input of sliders) {
    params[input.dataset.key] = Number(input.value);
  }
  return params;
}

function scheduleDetect() {
  if (!state.imageId) {
    setStatus("请先导入一张 JPEG 或 PNG 图片。");
    return;
  }
  clearTimeout(state.timer);
  state.timer = setTimeout(detectNow, 250);
}

async function detectNow() {
  if (!state.imageId) {
    setStatus("请先导入一张 JPEG 或 PNG 图片。");
    return;
  }
  const seq = ++state.seq;
  setStatus("检测中…");
  try {
    const response = await fetch("/api/detect", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: state.imageId, params: readParams() }),
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "检测失败");
    if (seq !== state.seq) return;
    state.circles = data.circles;
    preview.src = data.preview;
    preview.hidden = false;
    renderCircles(data.circles);
    exportButton.disabled = data.circles.length === 0;
    setStatus(data.circles.length
      ? `检出 ${data.circles.length} 个圆。`
      : "未检出圆，可放宽 param2 或调整半径范围。");
  } catch (error) {
    if (seq !== state.seq) return;
    setStatus(`检测失败：${error.message}`, true);
  }
}

function renderCircles(circles) {
  circleBody.replaceChildren();
  circles.forEach((circle, index) => {
    const row = document.createElement("tr");
    for (const value of [index + 1, circle.x, circle.y, circle.r]) {
      const cell = document.createElement("td");
      cell.textContent = value;
      row.appendChild(cell);
    }
    circleBody.appendChild(row);
  });
  circleTable.hidden = circles.length === 0;
}

fileInput.addEventListener("change", async () => {
  const file = fileInput.files[0];
  if (!file) return;
  if (!/\.(jpe?g|png)$/i.test(file.name)) {
    setStatus("仅支持 JPEG 或 PNG 图片。", true);
    fileInput.value = "";
    return;
  }
  setStatus(`正在导入 ${file.name} …`);
  try {
    const response = await fetch("/api/upload", {
      method: "POST",
      headers: { "X-Filename": encodeURIComponent(file.name) },
      body: file,
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "导入失败");
    state.imageId = data.id;
    state.imageName = data.filename;
    imageInfo.textContent = `${data.filename} · ${data.width} × ${data.height}`;
    await detectNow();
  } catch (error) {
    setStatus(`导入失败：${error.message}`, true);
  } finally {
    fileInput.value = "";
  }
});

exportButton.addEventListener("click", async () => {
  if (!state.imageId || state.circles.length === 0) {
    setStatus("没有可导出的标注结果。", true);
    return;
  }
  try {
    const response = await fetch("/api/export", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: state.imageId, params: readParams() }),
    });
    if (!response.ok) {
      const data = await response.json().catch(() => ({}));
      throw new Error(data.error || "导出失败");
    }
    const blob = await response.blob();
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `${state.imageName.replace(/\.[^.]+$/, "")}-annotated.png`;
    link.click();
    URL.revokeObjectURL(url);
    setStatus("标注图已导出。");
  } catch (error) {
    setStatus(`导出失败：${error.message}`, true);
  }
});

for (const input of sliders) {
  input.addEventListener("input", () => {
    syncLabels();
    scheduleDetect();
  });
}

resetButton.addEventListener("click", () => {
  for (const input of sliders) {
    input.value = DEFAULTS[input.dataset.key];
  }
  syncLabels();
  scheduleDetect();
});

syncLabels();
</script>
</body>
</html>
